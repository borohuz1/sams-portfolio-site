name: Deploy to GitHub Pages

# Builds the world and publishes it to GitHub Pages on every push to main.
# The site lives at https://borohuz1.github.io/sams-portfolio-site/
# It publishes the build to a gh-pages branch; Pages serves that branch.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci
        env:
          # package-lock.json is committed; keep the install deterministic.
          CI: 'true'

      - name: Build
        run: npm run build
        env:
          # The site ships uncompressed assets on purpose. Never set
          # VITE_COMPRESSED here unless the -compressed.glb models and the
          # .ktx textures have been regenerated. See README.md.
          VITE_COMPRESSED: ''
          VITE_MUSIC: '1'
          VITE_LOG: '1'

      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy ${{ github.sha }}'
